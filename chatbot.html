<!DOCTYPE html>
<html>
<head>
<title>Ultimate AI Voice Assistant</title>

<style>
body{
    margin:0;
    font-family:Segoe UI;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.chatbox{
    width:420px;
    background:rgba(0,0,0,0.75);
    padding:20px;
    border-radius:20px;
    box-shadow:0 0 30px black;
}

h2{text-align:center;}

#messages{
    height:220px;
    overflow-y:auto;
    background:rgba(255,255,255,0.08);
    padding:10px;
    border-radius:12px;
    margin-bottom:10px;
    display:flex;
    flex-direction:column;
}

.msg{
    margin:6px 0;
    padding:8px 12px;
    border-radius:15px;
    line-height:1.5;
    max-width:80%;
}

.user{
    background:#ff4b2b;
    align-self:flex-end;
    text-align:right;
}

.bot{
    background:#1e90ff;
    align-self:flex-start;
}

input,select,button{
    width:100%;
    padding:8px;
    margin:5px 0;
    border-radius:8px;
    border:none;
}

button{
    background:#ff416c;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#ff4b2b;
}
</style>
</head>

<body>

<div class="chatbox">

<h2>🎙 Smart Voice Assistant</h2>

<div id="messages"></div>

<input type="text" id="userInput" placeholder="Type message & press Enter">

<select id="voiceSelect">
<option value="female">Female Voice</option>
<option value="male">Male Voice</option>
</select>

<select id="languageSelect">
<option value="en-US">English</option>
<option value="hi-IN">Hindi</option>
</select>

<label>Voice Speed</label>
<input type="range" id="speed" min="0.6" max="1.8" step="0.1" value="1">

<button onclick="sendMessage()">Send</button>
<button onclick="toggleMusic()">Toggle Music</button>

<audio id="bgMusic" loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

</div>

<script>

let voices=[];
let music=document.getElementById("bgMusic");
let musicPlaying=false;

function loadVoices(){
    voices = speechSynthesis.getVoices();
}
speechSynthesis.onvoiceschanged = loadVoices;

function sendMessage(){
    let input=document.getElementById("userInput").value.trim();
    if(input==="") return;

    addMessage(input,"user");

    speak(input);   // 🔥 USER INPUT ALSO SPEAK

    let reply=generateReply(input);

    setTimeout(()=>{
        addMessage(reply,"bot");
        speak(reply);
    },1000);

    document.getElementById("userInput").value="";
}

document.getElementById("userInput")
.addEventListener("keypress",function(e){
    if(e.key==="Enter"){
        sendMessage();
    }
});

function addMessage(text,type){
    let div=document.createElement("div");
    div.classList.add("msg",type);
    div.innerText=text;
    document.getElementById("messages").appendChild(div);
    document.getElementById("messages").scrollTop=
    document.getElementById("messages").scrollHeight;
}

function generateReply(input){
    input=input.toLowerCase();

    if(input.includes("hello")||input.includes("hi"))
        return "Hello Raksha! Nice to talk with you.";
    if(input.includes("kaise ho"))
        return "Main bilkul theek hoon!";
    if(input.includes("html"))
        return "HTML web pages ka structure hota hai.";
    if(input.includes("css"))
        return "CSS design ke liye use hota hai.";
    
    return "Hi tell me about yourself";
}

function speak(text){

    let speech=new SpeechSynthesisUtterance(text);

    let selectedVoice=document.getElementById("voiceSelect").value;
    let selectedLang=document.getElementById("languageSelect").value;
    let speed=document.getElementById("speed").value;

    speech.lang=selectedLang;
    speech.rate=speed;

    let filteredVoices = voices.filter(v => v.lang.includes(selectedLang));

    if(selectedVoice==="female"){
        speech.voice = filteredVoices.find(v =>
            v.name.includes("Zira") || 
            v.name.includes("Samantha")
        ) || filteredVoices[0];
    }else{
        speech.voice = filteredVoices.find(v =>
            v.name.includes("David") || 
            v.name.includes("Mark")
        ) || filteredVoices[0];
    }

    speechSynthesis.speak(speech);
}

function toggleMusic(){
    if(!musicPlaying){
        music.volume=0.3;
        music.play();
        musicPlaying=true;
    }else{
        music.pause();
        musicPlaying=false;
    }
}

</script>

</body>
</html>
