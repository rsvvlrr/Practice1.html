<!DOCTYPE html>
<html>
<head>
<title>Ultimate Tug of War</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    text-align:center;
    font-family:Arial;
    background:linear-gradient(270deg,#ff512f,#dd2476,#1fa2ff);
    background-size:600% 600%;
    animation:bg 8s infinite alternate;
    color:white;
}
@keyframes bg{
    0%{background-position:0%}
    100%{background-position:100%}
}

h1{margin-top:15px;}

.game{
    width:90%;
    max-width:900px;
    height:150px;
    margin:30px auto;
    position:relative;
    background:rgba(255,255,255,0.2);
    border-radius:20px;
    overflow:hidden;
}

.player{
    position:absolute;
    top:40px;
    font-size:40px;
}

#leftPlayer{left:10px;}
#rightPlayer{right:10px;}

.rope{
    width:120px;
    height:100%;
    background:linear-gradient(brown,#5a2d0c);
    position:absolute;
    left:calc(50% - 60px);
    transition:0.1s;
    border-radius:10px;
    box-shadow:0 0 20px yellow;
}

.powerBar{
    width:80%;
    height:15px;
    margin:10px auto;
    background:#333;
    border-radius:10px;
    overflow:hidden;
}
.powerFill{
    height:100%;
    width:50%;
    background:lime;
    transition:0.1s;
}

button{
    padding:10px 20px;
    margin:10px;
    font-size:16px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.mobileControls{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:10px;
}

.scoreboard{
    font-size:20px;
    margin-top:10px;
}

.timer{
    font-size:22px;
    margin-top:10px;
}

.winner{
    font-size:26px;
    font-weight:bold;
    margin-top:10px;
}

</style>
</head>

<body>

<h1>🔥 Ultimate Tug of War 🔥</h1>

<div class="timer">⏱ Time: <span id="time">10</span></div>

<div class="game">
    <div id="leftPlayer" class="player">💪</div>
    <div id="rightPlayer" class="player">💪</div>
    <div class="rope" id="rope"></div>
</div>

<div class="powerBar">
    <div class="powerFill" id="power"></div>
</div>

<div class="scoreboard">
    Left: <span id="leftScore">0</span> |
    Right: <span id="rightScore">0</span>
</div>

<div class="winner" id="winnerText"></div>

<div class="mobileControls">
    <button onclick="moveLeft()">LEFT</button>
    <button onclick="moveRight()">RIGHT</button>
</div>

<button onclick="restartGame()">Restart Round</button>

<audio id="winSound">
<source src="https://www.soundjay.com/buttons/sounds/button-3.mp3">
</audio>

<script>

let rope=document.getElementById("rope");
let power=document.getElementById("power");
let winnerText=document.getElementById("winnerText");
let timeDisplay=document.getElementById("time");
let leftScoreDisplay=document.getElementById("leftScore");
let rightScoreDisplay=document.getElementById("rightScore");
let winSound=document.getElementById("winSound");

let position=50;
let time=10;
let leftScore=0;
let rightScore=0;
let gameOver=false;

let timer=setInterval(updateTimer,1000);

function updateTimer(){
    if(gameOver) return;
    time--;
    timeDisplay.innerText=time;
    if(time<=0){
        decideWinner();
    }
}

function moveLeft(){
    if(gameOver) return;
    position-=3;
    updateGame();
}

function moveRight(){
    if(gameOver) return;
    position+=3;
    updateGame();
}

document.addEventListener("keydown",function(e){
    if(e.key==="a"||e.key==="A") moveLeft();
    if(e.key==="l"||e.key==="L") moveRight();
});

function updateGame(){
    if(position<0) position=0;
    if(position>100) position=100;

    rope.style.left="calc("+position+"% - 60px)";
    power.style.width=position+"%";

    if(position<=0||position>=100){
        decideWinner();
    }
}

function decideWinner(){
    gameOver=true;
    winSound.play();

    if(position<50){
        leftScore++;
        winnerText.innerText="🏆 Left Wins Round!";
    }else{
        rightScore++;
        winnerText.innerText="🏆 Right Wins Round!";
    }

    leftScoreDisplay.innerText=leftScore;
    rightScoreDisplay.innerText=rightScore;

    if(leftScore===3){
        winnerText.innerText="🔥 LEFT WINS TOURNAMENT!";
    }
    if(rightScore===3){
        winnerText.innerText="🔥 RIGHT WINS TOURNAMENT!";
    }
}

function restartGame(){
    position=50;
    rope.style.left="calc(50% - 60px)";
    power.style.width="50%";
    winnerText.innerText="";
    time=10;
    timeDisplay.innerText=time;
    gameOver=false;
}

</script>

</body>
</html>
